# /etc/rancher/k3s/config.yaml on server-4 (192.168.50.146) - an additional server (etcd member).
# Replace <K3S_TOKEN> with the contents of /var/lib/rancher/k3s/server/token on server-1.
# Never commit the real token. Steps: docs/hardware/mac-lima-vm.md
server: https://192.168.50.10:6443
token: <K3S_TOKEN>
node-name: server-4
node-ip: 192.168.50.146,fd00:1234:5678:50:5055:55ff:fe15:f169
tls-san:
  - 192.168.50.10
cluster-cidr: 10.42.0.0/16,fd00:1234:5678:4200::/56
service-cidr: 10.43.0.0/16,fd00:1234:5678:4300::/112
flannel-ipv6-masq: true
flannel-iface: lima0
disable:
  - servicelb
# Etcd metrics on this node's address, port 2381, for Prometheus
# (docs/operations/monitoring-grafana.md, Phase 2). Plain HTTP with no login: the node
# firewall blocks 2381 from the LAN.
etcd-expose-metrics: true
# flannel-iface MUST be lima0 (the bridged LAN interface). With eth0 the VM advertises its
# private NAT address 192.168.5.15 and its pods cannot reach cluster DNS.
# The IPv6 node-ip is the VM's SLAAC address; it is derived from the VM's MAC
# (52:55:55:15:F1:69), so it stays the same as long as the MAC does.
