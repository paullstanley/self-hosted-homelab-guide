# /etc/rancher/k3s/config.yaml on server-1 (192.168.50.5) - the FIRST server.
# This file has no secret in it. Steps: docs/kubernetes/k3s-ha-cluster.md
node-ip: 192.168.50.5,fd00:1234:5678:50::5
cluster-cidr: 10.42.0.0/16,fd00:1234:5678:4200::/56
service-cidr: 10.43.0.0/16,fd00:1234:5678:4300::/112
flannel-ipv6-masq: true
flannel-iface: eth0
# Embedded etcd. On a brand-new cluster this starts etcd; it is ignored once etcd exists.
cluster-init: true
# The floating API address (kube-vip) must be in the API certificate.
tls-san:
  - 192.168.50.10
# MetalLB hands out addresses. The built-in k3s load balancer must stay off on EVERY server,
# or it takes Pi-hole and Traefik back onto the nodes' own addresses after a restart.
disable:
  - servicelb
# Etcd metrics on this node's address, port 2381, for Prometheus
# (docs/operations/monitoring-grafana.md, Phase 2). Plain HTTP with no login: the node
# firewall blocks 2381 from the LAN.
etcd-expose-metrics: true
