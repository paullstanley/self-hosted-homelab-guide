# MetalLB address pools and L2 advertisement. MetalLB version: v0.15.3 (use exactly this one;
# v0.16.0's controller failed its liveness probe here and the :main image crash-looped).
#
#   sudo kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/v0.15.3/config/manifests/metallb-native.yaml
#   sudo kubectl -n metallb-system rollout status deploy/controller --timeout=180s
#   sudo kubectl apply -f files/metallb/config.yaml
#
# Addresses in use (docs/kubernetes/load-balancers.md):
#   192.168.50.10  NOT MetalLB - kube-vip, the Kubernetes API. Deliberately outside this pool.
#   192.168.50.11  Pi-hole (DNS + web), requested by name in files/pihole/values.yaml
#   192.168.50.12  Traefik (every web app: Pi-hole UI, Homebridge, Seerr, Grafana)
#   192.168.50.13  FlareSolverr (files/flaresolverr)
#   192.168.50.14-15  free
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: pool
  namespace: metallb-system
spec:
  addresses:
  - 192.168.50.11-192.168.50.15
---
# IPv6 is a separate pool with autoAssign off, so no other Service can take the Pi-hole's
# IPv6 address; it is only given to a Service that asks for it by address.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: pool-v6
  namespace: metallb-system
spec:
  addresses:
  - fd00:1234:5678:50::11/128
  autoAssign: false
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2-advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
  - pool
  - pool-v6
